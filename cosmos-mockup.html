// ── FILE POINTS (bản đồ codebase) — dựng sẵn, ẩn ở chế độ vũ trụ ──
const total=FILES.length;
const posArr=new Float32Array(total*3), colArr=new Float32Array(total*3), sizeArr=new Float32Array(total), litArr=new Float32Array(total);
const stars=[]; const galaxyInfo=[];
const galList=[...galaxies.entries()].sort((a,b)=>b[1].length-a[1].length);
const nG=galList.length; const maxLines=Math.max(...FILES.map(f=>f.lines||1));
let idx=0;
galList.forEach(([dir,files],gi)=>{
  const ang=(gi/nG)*Math.PI*2, ringR=30;
  const cx=Math.cos(ang)*ringR, cz=Math.sin(ang)*ringR, cy=(gi%2?1:-1)*(4+gi*1.2);
  const center=new THREE.Vector3(cx,cy,cz); const gcol=dirColor(dir);
  galaxyInfo.push({dir,center,count:files.length,color:gcol});
  const Rg=rng((hashCode(dir)&0xffff)||1); const spread=4+Math.sqrt(files.length)*1.6;
  files.forEach((f,fi)=>{
    const arm=fi%3; const rr=spread*(0.2+0.8*Math.sqrt(Rg())); const th=rr*0.4+arm*(Math.PI*2/3)+(Rg()-0.5)*0.7;
    const x=cx+Math.cos(th)*rr, z=cz+Math.sin(th)*rr, y=cy+(Rg()-0.5)*spread*0.4;
    posArr[idx*3]=x; posArr[idx*3+1]=y; posArr[idx*3+2]=z;
    const c=gcol.clone(); const lum=0.5+0.4*Math.min(1,(f.lines||1)/maxLines); c.offsetHSL(0,0,lum-0.62);
    colArr[idx*3]=c.r; colArr[idx*3+1]=c.g; colArr[idx*3+2]=c.b;
    sizeArr[idx]=1.2+Math.log2((f.lines||1)+1)*0.85; litArr[idx]=0;
    stars.push({path:f.path,lines:f.lines||0,dir,ext:(f.path.split(".").pop()||""),worldPos:new THREE.Vector3(x,y,z),i:idx});
    idx++;
  });
});
const fileGeo=new THREE.BufferGeometry();
fileGeo.setAttribute("position",new THREE.BufferAttribute(posArr,3));
fileGeo.setAttribute("color",new THREE.BufferAttribute(colArr,3));
fileGeo.setAttribute("aSize",new THREE.BufferAttribute(sizeArr,1));
fileGeo.setAttribute("aLit",new THREE.BufferAttribute(litArr,1));
const fileMat=new THREE.ShaderMaterial({
  uniforms:{uTex:{value:SPRITE},uTime:{value:0},uPix:{value:renderer.getPixelRatio()},uReveal:{value:0}},
  vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize; attribute float aLit; varying vec3 vColor; varying float vLit; uniform float uTime,uPix,uReveal;
    void main(){ float pulse=1.0+aLit*0.8*sin(uTime*6.0); vColor=mix(color,vec3(1.0,1.0,0.85),aLit*0.7); vLit=aLit;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*uPix*(300.0/-mv.z)*(1.0+aLit*1.4)*pulse*uReveal;
      gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D uTex; uniform float uReveal; varying vec3 vColor; varying float vLit;
    void main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(vColor,t.a*(0.75+vLit*0.25)*uReveal); }`
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=playing?Math.min(clock.getDelta(),0.05):0; const T=clock.elapsedTime;

  // reveal lerp theo mode
  reveal += ((MODE==="repo"?1:0)-reveal)*0.06;
  fileMat.uniforms.uReveal.value=reveal;

  yaw+=(tYaw-yaw)*0.06; pitch+=(tPitch-pitch)*0.06; dist+=(tDist-dist)*0.05;
  orbitTarget.lerp(tOrbitTarget,0.06);
  const px2=yaw+mX*0.08, py2=pitch+mY*0.05;
  camera.position.x=orbitTarget.x+Math.sin(px2)*Math.cos(py2)*dist;
  camera.position.y=orbitTarget.y+Math.sin(py2)*dist+6;
  camera.position.z=orbitTarget.z+Math.cos(px2)*Math.cos(py2)*dist;
  camera.lookAt(orbitTarget);

  bg.rotation.y+=dt*0.003; bg.material.uniforms.uTime.value=T; fileMat.uniforms.uTime.value=T;

  // ── UNI: nguồn hiện, inflow chảy, lõi sáng; REPO: nguồn mờ, file hiện ──
  const uniVis=1-reveal;
  srcGroup.visible = uniVis>0.02; srcGroup.traverse(o=>{ if(o.material&&o.material.opacity!==undefined && o.material.map===SPRITE){} });
  srcObjs.forEach(g=>{ const sc=g.userData.sc; const s=1+Math.sin(T*1.6+g.position.x)*0.08;
    g.userData.core.scale.setScalar(s); g.userData.hot.scale.setScalar(s);
    g.userData.halo.material.opacity=(0.6+Math.sin(T*2+g.position.y)*0.15)*uniVis;
    g.userData.core.material.opacity=uniVis; g.userData.core.material.transparent=true;
    g.userData.hot.material.opacity=uniVis; g.userData.hot.material.transparent=true; });
  nebulae.forEach(n=>{ n.material.opacity=n.userData.baseOp*(0.7+0.3*Math.sin(T*n.userData.spd+n.userData.ph))*uniVis; });
  inflow.forEach(s=>{ const arr=s.p.geometry.attributes.position.array;
    for(let i=0;i<s.n;i++){ s.ts[i]+=dt*0.45; if(s.ts[i]>1)s.ts[i]-=1; const t=s.ts[i], e=t*t;
      const p=s.from.clone().multiplyScalar(1-e).add(CORE.clone().multiplyScalar(e)); p.y+=Math.sin(t*3.14)*4*(1-t);
      arr[i*3]=p.x;arr[i*3+1]=p.y;arr[i*3+2]=p.z; }
    s.p.geometry.attributes.position.needsUpdate=true; s.p.material.opacity=0.9*uniVis; });

  // lõi codebase pulse (uni) — ở repo mode thu nhỏ nhường chỗ file
  const coreScale = 1*uniVis + 0.15*reveal;
  coreGrp.scale.setScalar(Math.max(0.05,coreScale));
  coreCore.scale.setScalar(1+Math.sin(T*3)*0.12); coreHot.scale.setScalar(1+Math.sin(T*3)*0.12);
  coreHalo.material.opacity=(0.85+Math.sin(T*2)*0.1)*(0.3+0.7*uniVis);
  coreRing.rotation.z+=dt*0.5;

  // halo thiên hà (repo)
  galaxyInfo.forEach(g=> g.halo.material.opacity=(0.09+0.03*Math.sin(T*0.5+g.center.x))*reveal);

  // ── work highlight (repo) ──
  if(playing){
    if(MODE==="repo" && workStars.length){ workTimer+=dt; if(workTimer>1.5){workTimer=0;workPtr=(workPtr+1)%workStars.length;}
      const cur=workStars[workPtr]; liveTxt.textContent=`Agent đang làm: ${cur.path.split("/").pop()}`;
      for(let i=0;i<total;i++) litVal[i]*=0.94; litVal[cur.i]=1;
    } else if(MODE==="uni"){ uniTimer+=dt; if(uniTimer>1.6){uniTimer=0;uniPtr=(uniPtr+1)%UNI_MSG.length;} liveTxt.textContent=UNI_MSG[uniPtr]; }
  }
  const litAttr=fileGeo.attributes.aLit.array; for(let i=0;i<total;i++) litAttr[i]=litVal[i]; fileGeo.attributes.aLit.needsUpdate=true;

  bloom.strength=0.9 + (selected?0.2:0) + (uniVis*0.15);
  composer.render();

  // ── nhãn ──
  srcLabels.forEach(({sc,el})=>{ const sp=sc._pos.clone().project(camera); const behind=sp.z>1;
    el.style.left=((sp.x*0.5+0.5)*innerWidth)+"px"; el.style.top=((-sp.y*0.5+0.5)*innerHeight)+"px"; el.style.opacity=(behind?0:uniVis*0.95); });
  { const sp=CORE.clone().project(camera); const behind=sp.z>1;
    coreLabel.style.left=((sp.x*0.5+0.5)*innerWidth)+"px"; coreLabel.style.top=((-sp.y*0.5+0.5)*innerHeight-30)+"px"; coreLabel.style.opacity=(behind?0:uniVis*0.95); }
  const showGlx=reveal>0.5 && dist>22;
  glxLabels.forEach(({g,el})=>{ const sp=g.center.clone().project(camera); const behind=sp.z>1;
    el.style.left=((sp.x*0.5+0.5)*innerWidth)+"px"; el.style.top=((-sp.y*0.5+0.5)*innerHeight)+"px"; el.style.opacity=(behind||!showGlx)?0:reveal*0.9; });
  const showFile = MODE==="repo" ? (selected||(workStars.length?workStars[workPtr]:null)) : null;
  if(showFile){ const sp=showFile.worldPos.clone().project(camera); const behind=sp.z>1;
    fileLabelEl.textContent=showFile.path.split("/").pop(); fileLabelEl.style.color=(selected?"#EAF0FF":"#FFB347");
    fileLabelEl.style.left=((sp.x*0.5+0.5)*innerWidth)+"px"; fileLabelEl.style.top=((-sp.y*0.5+0.5)*innerHeight)+"px"; fileLabelEl.style.opacity=behind?0:reveal; } else fileLabelEl.style.opacity=0;

  const raH=((Math.floor((yaw/Math.PI+1)*12))%24+24)%24, raM=Math.floor(Math.abs(yaw*120)%60), dec=Math.round(-pitch*60);
  raEl.textContent=`RA ${String(raH).padStart(2,'0')}ʰ${String(raM).padStart(2,'0')}ᵐ · DEC ${dec>=0?'+':'−'}${Math.abs(dec)}°`;
  zoomEl.textContent=`×${(120/dist).toFixed(1)}`;
}
animate();

addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); bloom.setSize(innerWidth,innerHeight); });
</script>
</body>
